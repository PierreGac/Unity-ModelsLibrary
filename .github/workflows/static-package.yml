name: Static package checks

on:
  push:
  pull_request:

jobs:
  static-package:
    name: Manifest, meta pairing, and release content
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the package
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run fixture checks and the current package
        run: python .github/scripts/validate_package_tests.py
