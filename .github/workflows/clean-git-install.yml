# Clean Git UPM install.
#
# A self-hosted Windows runner uses the Unity Hub license already on that
# machine. No license file is committed. GitHub-hosted runners cannot run
# this job.
#
# The install URL is the repository root. Tag v1.0.12 is not created, so the
# URL resolves to the default branch. The old ?path=Assets/ModelLibrary query
# is rejected by the script.

name: Clean Git UPM install

on:
  push:
  pull_request:

jobs:
  clean-git-install:
    name: Root Git URL install and settings persistence
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out the package
        uses: actions/checkout@v5

      - name: Install from the root Git URL and reload settings
        shell: pwsh
        run: ./.github/scripts/verify-clean-git-install.ps1

      - name: Retain install logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clean-git-install-logs
          if-no-files-found: warn
          path: C:/UnityGit/CleanGitInstall4C-logs
